    <rect x="512" y="850" width="196" height="30" rx="15" fill="#1B7837" stroke="#222" stroke-width="1.8" stroke-dasharray="5 3"/><text x="610" y="870" fill="#FFF">S10 Team 14 (operators)</text>
    <rect x="372" y="348" width="226" height="30" rx="15" fill="#7FBF7B" stroke="#222" stroke-width="1.8"/><text x="485" y="368" fill="#222">S9 NC OSBM (sponsor, owner)</text>
    <rect x="614" y="348" width="234" height="30" rx="15" fill="#BDBDBD" stroke="#222" stroke-width="1.8"/><text x="731" y="368" fill="#222">S3 DHHS executive leadership</text>
    <rect x="380" y="388" width="226" height="30" rx="15" fill="#F1A340" stroke="#222" stroke-width="1.8"/><text x="492" y="408" fill="#222">S6 NCDIT security &amp; privacy</text>
