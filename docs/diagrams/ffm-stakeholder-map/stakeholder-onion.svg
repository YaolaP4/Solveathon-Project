    <rect x="346" y="1150" width="271" height="30" rx="15" fill="#7FBF7B" stroke="#222" stroke-width="1.8" stroke-dasharray="5 3"/><text x="482" y="1170" fill="#222">S16 Local govts, utilities &amp; orgs</text>
