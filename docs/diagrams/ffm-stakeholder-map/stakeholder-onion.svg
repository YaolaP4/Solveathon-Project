<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 1560 1290" width="1560" height="1290" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, Helvetica, sans-serif">
  <title id="t">Federal Funds Matchmaker: Stakeholder Onion Diagram</title>
  <desc id="d">Onion model with the matchmaker, a central tool for NC state agencies, at the centre. Ring 2, the system: S1 DHHS federal-grants coordinator, S2 DHHS division program leads, S10 Team 14, S19 NC DEQ grants coordinator. Ring 3, the containing system: S3 DHHS executive leadership, S4 DHHS division directors, S5 DHHS division program staff, S6 NCDIT security and privacy, S7 DHHS privacy and security office, S8 procurement and legal, S9 NC OSBM (sponsor and owner of the central tool), S20 NC DEQ leadership, S21 smaller agencies with limited grant capacity. Ring 4, the wider environment: S11 Solve-a-thon hosts, S12 Microsoft Azure, S13 Grants.gov, S14 USAspending.gov, S15 federal awarding agencies, S16 local recipients (local governments, utilities, community organizations), S17 NC residents, S18 grant-writing consultants. Pill colour shows attitude; a dashed outline marks external stakeholders.</desc>
  <rect width="1560" height="1290" fill="#FFF"/>
  <text x="40" y="42" font-size="26" font-weight="700" fill="#08427B">Federal Funds Matchmaker: Stakeholder Onion</text>
  <text x="40" y="68" font-size="14" fill="#555">Team 14, UNC Solve-a-thon 2026 • Sponsor: NC OSBM • Agencies: NC DHHS, NC DEQ • Onion model (I. Alexander) • 2026-11-07 • v1.2</text>
  <circle cx="610" cy="680" r="590" fill="#EEF3FA" stroke="#9DB6D5" stroke-width="2"/>
  <circle cx="610" cy="680" r="420" fill="#DCE6F2" stroke="#7FA0C8" stroke-width="2"/>
  <circle cx="610" cy="680" r="250" fill="#C5D7EC" stroke="#5F88BB" stroke-width="2"/>
  <circle cx="610" cy="680" r="105" fill="#1168BD" stroke="#0B4884" stroke-width="2"/>
  <g font-size="13" font-weight="700" fill="#08427B" text-anchor="middle" letter-spacing="1">
    <text x="610" y="125">4 · WIDER ENVIRONMENT</text>
    <text x="610" y="330">3 · CONTAINING SYSTEM</text>
    <text x="610" y="908">2 · THE SYSTEM</text>
  </g>
  <text x="610" y="658" font-size="17" font-weight="700" fill="#FFF" text-anchor="middle">Federal Funds</text>
  <text x="610" y="680" font-size="17" font-weight="700" fill="#FFF" text-anchor="middle">Matchmaker</text>
  <text x="610" y="700" font-size="13" fill="#FFF" text-anchor="middle">for NC state agencies</text>
  <text x="610" y="724" font-size="12" fill="#FFF" text-anchor="middle">1 · Product</text>
  <g font-size="12" font-weight="600" text-anchor="middle">
    <rect x="500" y="480" width="219" height="30" rx="15" fill="#7FBF7B" stroke="#222" stroke-width="1.8"/><text x="610" y="500" fill="#222">S1 DHHS grants coordinator</text>
    <rect x="500" y="520" width="219" height="30" rx="15" fill="#BDBDBD" stroke="#222" stroke-width="1.8"/><text x="610" y="540" fill="#222">S19 DEQ grants coordinator</text>
