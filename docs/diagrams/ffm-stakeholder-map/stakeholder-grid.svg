<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 1440 1010" width="1440" height="1010" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, Helvetica, sans-serif">
  <title id="t">Federal Funds Matchmaker for NC DHHS: Stakeholder Power/Interest Grid</title>
  <desc id="d">Mendelow power/interest grid placing 18 stakeholders in four quadrants. Manage Closely: S1 federal-grants coordinator, S2 division program leads, S3 DHHS executive leadership, S4 division directors, S9 NC OSBM. Keep Satisfied: S6 NCDIT security and privacy, S7 DHHS privacy and security office, S8 procurement and legal, S11 Solve-a-thon hosts, S13 Grants.gov. Keep Informed: S5 division program staff, S10 Team 14, S16 local health departments and community organizations. Monitor: S12 Microsoft Azure, S14 USAspending.gov, S15 federal awarding agencies, S17 NC residents, S18 grant-writing consultants. Marker colour shows attitude; a solid outline marks stakeholders inside NC state government and a dashed outline marks external stakeholders; dashed arrows show the desired rise in interest for S3, S6 and S7.</desc>
